[package]
name = "flappy-llm"
version = "0.1.0"
edition = "2021"

[features]
# Default is mock provider only
default = ["mock"]
# The openai feature enables the openai provider and its dependencies
openai = ["dep:reqwest", "dep:serde", "dep:serde_json"]
mock = ["dep:async-stream"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }

# Optional dependencies activated by features
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
async-stream = { version = "0.3", optional = true }
